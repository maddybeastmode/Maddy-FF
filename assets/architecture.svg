<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">
  <defs>
    <linearGradient id="lG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="lG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="lG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="lS"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/></filter>
    <marker id="lA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <text x="320" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Likes Bot Architecture</text>
  <!-- Guest Pool -->
  <rect x="20" y="50" width="140" height="60" rx="12" fill="url(#lG1)" filter="url(#lS)"/>
  <text x="90" y="78" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Guest Pool</text>
  <text x="90" y="95" font-family="monospace" font-size="8" fill="white" text-anchor="middle">SQLite + JSON</text>
  <!-- Auth -->
  <rect x="200" y="50" width="140" height="60" rx="12" fill="url(#lG2)" filter="url(#lS)"/>
  <text x="270" y="78" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">OAuth + JWT</text>
  <text x="270" y="95" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Garena Auth Flow</text>
  <!-- Like Engine -->
  <rect x="380" y="50" width="140" height="60" rx="12" fill="url(#lG3)" filter="url(#lS)"/>
  <text x="450" y="78" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Like Engine</text>
  <text x="450" y="95" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Protobuf + AES</text>
  <!-- Arrows -->
  <line x1="160" y1="80" x2="195" y2="80" stroke="#666" stroke-width="2" marker-end="url(#lA)"/>
  <line x1="340" y1="80" x2="375" y2="80" stroke="#666" stroke-width="2" marker-end="url(#lA)"/>
  <!-- Garena API -->
  <rect x="200" y="160" width="240" height="50" rx="12" fill="#2D2D2D" stroke="#f5576c" stroke-width="1.5" filter="url(#lS)"/>
  <text x="320" y="190" font-family="monospace" font-size="11" fill="#f5576c" text-anchor="middle" font-weight="bold">Garena Server (ggpolarbear.com)</text>
  <line x1="450" y1="110" x2="380" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#lA)"/>
  <!-- Rate Limiter -->
  <rect x="20" y="160" width="140" height="50" rx="12" fill="#2D2D2D" stroke="#4facfe" stroke-width="1.5" filter="url(#lS)"/>
  <text x="90" y="190" font-family="monospace" font-size="11" fill="#4facfe" text-anchor="middle" font-weight="bold">Rate Limiter</text>
  <line x1="90" y1="110" x2="90" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#lA)"/>
  <!-- Output -->
  <rect x="200" y="235" width="240" height="35" rx="10" fill="#2D2D2D" stroke="#43e97b" stroke-width="1.5"/>
  <text x="320" y="258" font-family="monospace" font-size="11" fill="#43e97b" text-anchor="middle" font-weight="bold">Likes Sent Successfully</text>
  <line x1="320" y1="210" x2="320" y2="230" stroke="#666" stroke-width="2" marker-end="url(#lA)"/>
</svg>
